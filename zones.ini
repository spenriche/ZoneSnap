# ZoneSnap settings. Edit and save; changes are picked up on the next drag.

[settings]
# key: shift, ctrl, alt, or none (none = zones always show while dragging)
key = shift
# gap: pixels of space between zones
gap = 6
# opacity: 10-100
opacity = 40
# colors as RRGGBB
color = 2D7DD2
highlight = 8CD2FF

# Which layout each monitor uses. 'default' applies to any monitor not listed.
[monitors]
default = My FancyZones layout

# Each zone is: x, y, width, height  (percent of the monitor, 0-100)
[layout My FancyZones layout]
0, 0, 2.52, 100
2.52, 0, 29.06, 100
31.58, 0, 34.43, 100
66.01, 0, 22.7, 100
88.71, 0, 11.29, 100

